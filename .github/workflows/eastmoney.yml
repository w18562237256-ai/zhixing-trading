name: Publish Eastmoney screener
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1-5'
    - cron: '30 8 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: eastmoney-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare site
        run: |
          mkdir -p public
          cp index.html public/index.html
          touch public/.nojekyll
      - name: Restore previous market snapshot
        continue-on-error: true
        run: |
          curl --fail --max-time 30 --retry 1 https://w18562237256-ai.github.io/zhixing-trading/eastmoney.enc.json -o public/eastmoney.enc.json || rm -f public/eastmoney.enc.json
      - name: Read Eastmoney and encrypt snapshot
        run: node data/collect.cjs public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
